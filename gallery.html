<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="">
  <title>Gallery | Cat Colony Care Society</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <script src="js/cmsTheme.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/site.css?v=4" rel="stylesheet">
</head>
<body class="page-gallery">
  <div data-component="header"></div>

  <main>
    <section class="route-intro gallery-intro">
      <div class="container">
        <div class="gallery-intro-grid">
          <div class="route-intro-copy">
            <p class="section-label">Life through our lens</p>
            <h1 data-cms-text="gallery.GalleryTitle">Gallery</h1>
            <p data-cms-text="gallery.GalleryDescription">A gallery of images.</p>
          </div>
          <div class="route-photo gallery-intro-photo" role="img" aria-label="Campus cat in the colony"></div>
        </div>
      </div>
    </section>

    <section class="gallery-section">
      <div class="container">
        <div class="collection-heading">
          <h2>Every photo tells a story.</h2>
          <p>Small moments from daily life around the colony.</p>
        </div>
        <div class="gallery-grid" data-cms-repeat="gallery">
          <template>
            <div class="gallery-item">
              <figure class="card gallery-card h-100 mb-0">
                <img class="card-img-top" data-cms-src="$item.Image" data-cms-alt="$item.Description" alt="Gallery image" loading="lazy">
                <figcaption class="card-body">
                  <p data-cms-text="$item.Description">Gallery description from CMS.</p>
                  <div class="gallery-meta">
                    <span data-cms-text="$item.Date">Date</span>
                    <span>Credit: <span data-cms-text="$item.Credit">Credit</span></span>
                  </div>
                </figcaption>
              </figure>
            </div>
          </template>
        </div>
      </div>
    </section>
  </main>

  <div data-component="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/cmsContentLoader.js"></script>
  <script src="js/cmsCache.js"></script>
  <script src="js/componentLoader.js?v=3"></script>
  <script src="js/cmsBinder.js"></script>
  <script src="js/cmsPage.js"></script>
  <script src="js/pages/gallery.js"></script>
</body>
</html>
