<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery | Cat Colony Care Society</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div data-component="header"></div>

  <main>
    <section class="py-5 bg-light border-bottom">
      <div class="container">
        <h1 class="display-5 fw-bold" data-cms-text="gallery.GalleryTitle">Gallery</h1>
        <p class="lead" data-cms-text="gallery.GalleryDescription">A gallery of images.</p>
      </div>
    </section>

    <section class="py-5">
      <div class="container">
        <div class="row g-4" data-cms-repeat="gallery">
          <template>
            <div class="col-md-6 col-lg-4">
              <figure class="card h-100 shadow-sm">
                <img class="card-img-top" data-cms-src="$item.Image" data-cms-alt="$item.Description" alt="Gallery image" loading="lazy">
                <figcaption class="card-body">
                  <p data-cms-text="$item.Description">Gallery description from CMS.</p>
                  <p class="small text-body-secondary mb-1" data-cms-text="$item.Date">Date</p>
                  <p class="small text-body-secondary mb-0">Credit: <span data-cms-text="$item.Credit">Credit</span></p>
                </figcaption>
              </figure>
            </div>
          </template>
        </div>
      </div>
    </section>
  </main>

  <div data-component="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/cmsContentLoader.js"></script>
  <script src="js/cmsCache.js"></script>
  <script src="js/componentLoader.js"></script>
  <script src="js/cmsBinder.js"></script>
  <script src="js/cmsPage.js"></script>
  <script src="js/pages/gallery.js"></script>
</body>
</html>
