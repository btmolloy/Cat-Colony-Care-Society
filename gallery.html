<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta name="theme-color" content="">
    <meta name="description" content="" data-cms-content="gallery.GalleryDescription">
    <meta property="og:title" content="Gallery" data-cms-content="gallery.GalleryTitle">
    <meta property="og:description" content="" data-cms-content="gallery.GalleryDescription">
    <title>Gallery | Cat Colony Care Society</title>
    <script src="js/cmsTheme.js?v=4"></script>
    <link rel="stylesheet" href="css/site.css?v=19">
  </head>
  <body data-page="gallery" data-title-path="gallery.GalleryTitle">
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div data-component="header"></div>

    <main id="main-content">
      <header
        class="page-masthead"
        style="--masthead-image: var(--brand-image-5, none)"
        data-cms-bg="branding.backgroundimage5"
        data-cms-bg-var="--masthead-image"
      >
        <div class="container masthead-inner">
          <div class="masthead-copy">
            <p class="eyebrow eyebrow-light">From around the colony</p>
            <h1 class="page-title" data-cms-text="gallery.GalleryTitle"></h1>
            <p class="page-lede" data-cms-text="gallery.GalleryDescription"></p>
          </div>
        </div>
      </header>

      <section class="section section-white gallery-section">
        <div class="container">
          <div class="gallery-toolbar" data-reveal>
            <p
              class="eyebrow"
              data-cms-count="gallery"
              data-cms-count-singular="photograph"
              data-cms-count-plural="photographs"
            ></p>
            <p class="gallery-sort-label">Newest first</p>
          </div>

          <div class="gallery-grid" data-cms-repeat="gallery">
            <template>
              <figure class="gallery-item" data-reveal>
                <a
                  class="gallery-photo-link"
                  target="_blank"
                  rel="noreferrer"
                  data-cms-href="$item.Image"
                >
                  <div
                    class="photo-surface"
                    style="--photo: var(--brand-image-5, none)"
                    data-cms-bg="$item.Image"
                    data-cms-title="$item.Description"
                  ></div>
                </a>
                <figcaption class="glass-card gallery-glass-caption">
                  <span class="gallery-caption" data-cms-text="$item.Description"></span>
                  <span class="gallery-meta">
                    <time
                      data-cms-text="$item.Date"
                      data-cms-datetime="$item.Date"
                      data-calendar-date
                      data-calendar-date-style="compact"
                    ></time>
                    <span class="gallery-credit" data-cms-text="$item.Credit"></span>
                  </span>
                </figcaption>
              </figure>
            </template>
          </div>

          <nav class="gallery-pagination glass-card" data-gallery-pagination aria-label="Gallery pages" hidden>
            <button class="gallery-page-direction" type="button" data-gallery-previous>Previous</button>
            <div class="gallery-page-numbers" data-gallery-page-numbers></div>
            <button class="gallery-page-direction" type="button" data-gallery-next>Next</button>
            <p class="sr-only" data-gallery-page-status aria-live="polite"></p>
          </nav>
        </div>
      </section>

      <section class="closing-band">
        <div class="container closing-grid" data-reveal>
          <div class="closing-copy">
            <p class="eyebrow eyebrow-light">Connect with the society</p>
            <h2 class="closing-title" data-cms-text="branding.Title"></h2>
            <p data-cms-text="branding.Description"></p>
          </div>
          <a class="button" href="get-involved.html">Contact CCCS</a>
        </div>
      </section>
    </main>

    <div data-component="footer"></div>

    <script src="js/cmsContentLoader.js"></script>
    <script src="js/cmsCache.js?v=3"></script>
    <script src="js/componentLoader.js?v=8"></script>
    <script src="js/cmsBinder.js?v=4"></script>
    <script src="js/cmsPage.js?v=4"></script>
    <script src="js/calendarComponent.js?v=5"></script>
    <script src="js/siteInteractions.js?v=3"></script>
    <script src="js/pages/gallery.js?v=5"></script>
  </body>
</html>
