<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta name="theme-color" content="">
    <meta name="description" content="" data-cms-content="calltoaction.Paragraph">
    <meta property="og:title" content="Get Involved" data-cms-content="calltoaction.Title">
    <meta property="og:description" content="" data-cms-content="calltoaction.Paragraph">
    <title>Get Involved | Cat Colony Care Society</title>
    <script src="js/cmsTheme.js?v=4"></script>
    <link rel="stylesheet" href="css/site.css?v=17">
  </head>
  <body data-page="involved" data-title-path="calltoaction.Title">
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div data-component="header"></div>

    <main id="main-content">
      <header
        class="page-masthead"
        style="--masthead-image: var(--brand-image-6, none)"
        data-cms-bg="branding.backgroundimage6"
        data-cms-bg-var="--masthead-image"
      >
        <div class="container masthead-inner">
          <div class="masthead-copy">
            <p class="eyebrow eyebrow-light">Membership, contact &amp; support</p>
            <h1 class="page-title" data-cms-text="calltoaction.Title"></h1>
            <p class="page-lede" data-cms-text="calltoaction.Paragraph"></p>
          </div>
        </div>
      </header>

      <section
        class="section section-photo-field"
        style="--section-image: var(--brand-image-1, none)"
        data-cms-bg="branding.backgroundimage1"
        data-cms-bg-var="--section-image"
      >
        <div class="container">
          <div class="action-grid action-grid-four" data-reveal>
            <article class="action-card glass-card">
              <p class="action-number">01 · JOIN</p>
              <h3>MyEngagement</h3>
              <p data-cms-text="contact.MyEngagmentURL"></p>
              <a class="text-link" target="_blank" rel="noreferrer" data-cms-href="contact.MyEngagmentURL">Open myEngagement</a>
            </article>

            <article class="action-card glass-card">
              <p class="action-number">02 · EMAIL</p>
              <h3>Email</h3>
              <p data-cms-text="contact.Email"></p>
              <a class="text-link" data-cms-mailto="contact.Email" data-cms-mailto-subject="Getting involved with CCCS">Start an email</a>
            </article>

            <article class="action-card glass-card">
              <p class="action-number">03 · FOLLOW</p>
              <h3>Instagram</h3>
              <p data-cms-text="contact.InstagramURL"></p>
              <a class="text-link" target="_blank" rel="noreferrer" data-cms-href="contact.InstagramURL">Open Instagram</a>
            </article>

            <article class="action-card glass-card">
              <p class="action-number">04 · CONNECT</p>
              <h3>GroupMe</h3>
              <p data-cms-text="contact.GroupMe"></p>
              <a class="text-link" target="_blank" rel="noreferrer" data-cms-href="contact.GroupMe">Open GroupMe</a>
            </article>
          </div>
        </div>
      </section>

      <section class="section section-ice">
        <div class="container">
          <div class="fundraiser-panel" data-reveal>
            <div class="photo-surface" style="--photo: var(--brand-image-6, none)" data-cms-bg="calltoaction.Image"></div>
            <div class="fundraiser-copy glass-card glass-card-dark">
              <p class="eyebrow eyebrow-light">Fundraising</p>
              <h2 class="feature-title" data-cms-text="gofundme.Title"></h2>
              <p data-cms-text="gofundme.Paragraph"></p>
              <a class="button" target="_blank" rel="noreferrer" data-cms-href="gofundme.Link">Open fundraiser</a>
            </div>
          </div>
        </div>
      </section>

    </main>

    <div data-component="footer"></div>

    <script src="js/cmsContentLoader.js"></script>
    <script src="js/cmsCache.js?v=3"></script>
    <script src="js/componentLoader.js?v=8"></script>
    <script src="js/cmsBinder.js?v=4"></script>
    <script src="js/cmsPage.js?v=4"></script>
    <script src="js/siteInteractions.js?v=3"></script>
    <script src="js/pages/contact.js?v=4"></script>
  </body>
</html>
