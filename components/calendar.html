<div class="container" data-calendar-component>
  <div class="card border-0 shadow-sm overflow-hidden cccs-calendar">
    <div class="card-body p-0">
      <div class="p-4 border-bottom bg-white">
        <div class="d-flex flex-column flex-lg-row justify-content-between gap-3">
          <div>
            <p class="text-uppercase fw-semibold text-success mb-1">Meeting Calendar</p>
            <h2 class="h3 mb-1" data-cms-text="meetingcalendar.CalendarTitle">Meeting Calendar</h2>
            <p class="text-body-secondary mb-0" data-calendar-range>Showing this week and the next three weeks.</p>
          </div>
          <div class="d-flex flex-wrap gap-2 align-items-start justify-content-lg-end">
            <span class="badge text-bg-success">Current week starts at the top</span>
            <span class="badge text-bg-light border text-body-secondary" data-calendar-month-note>Next month days are shaded.</span>
          </div>
        </div>
      </div>

      <div class="cccs-calendar-scroll">
        <div class="cccs-calendar-grid" role="grid" aria-label="Meeting calendar">
          <div class="cccs-calendar-weekdays" role="row">
            <div class="cccs-calendar-weekday" role="columnheader">Sun</div>
            <div class="cccs-calendar-weekday" role="columnheader">Mon</div>
            <div class="cccs-calendar-weekday" role="columnheader">Tue</div>
            <div class="cccs-calendar-weekday" role="columnheader">Wed</div>
            <div class="cccs-calendar-weekday" role="columnheader">Thu</div>
            <div class="cccs-calendar-weekday" role="columnheader">Fri</div>
            <div class="cccs-calendar-weekday" role="columnheader">Sat</div>
          </div>
          <div class="cccs-calendar-days" data-calendar-grid></div>
        </div>
      </div>

      <div class="p-4 border-top bg-light-subtle text-body-secondary" data-calendar-empty hidden>
        No meeting calendar events are scheduled in this four-week view.
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="calendarEventModal" tabindex="-1" aria-labelledby="calendarEventModalTitle" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title fs-5" id="calendarEventModalTitle">Calendar Event</h3>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p class="mb-2"><strong>Date:</strong> <span data-calendar-modal-date>Date</span></p>
        <p class="mb-2"><strong>Location:</strong> <span data-calendar-modal-location>Location</span></p>
        <p class="mb-0" data-calendar-modal-description>Description</p>
      </div>
    </div>
  </div>
</div>

<style>
  .cccs-calendar-scroll {
    overflow-x: auto;
  }

  .cccs-calendar-grid {
    min-width: 760px;
  }

  .cccs-calendar-weekdays,
  .cccs-calendar-days {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
  }

  .cccs-calendar-days {
    border-left: 1px solid var(--bs-border-color);
    border-top: 1px solid var(--bs-border-color);
    grid-template-rows: repeat(4, minmax(10rem, auto));
  }

  .cccs-calendar-weekday {
    background: var(--bs-success);
    color: var(--bs-white);
    font-weight: 700;
    padding: 0.75rem;
    text-align: center;
  }

  .cccs-calendar-day {
    background: var(--bs-white);
    border-bottom: 1px solid var(--bs-border-color);
    border-right: 1px solid var(--bs-border-color);
    display: flex;
    flex-direction: column;
    min-height: 10rem;
    padding: 0.75rem;
    position: relative;
  }

  .cccs-calendar-day-next-month {
    background: var(--bs-light);
    color: var(--bs-secondary-color);
  }

  .cccs-calendar-day-current {
    outline: 3px solid rgba(25, 135, 84, 0.35);
    outline-offset: -3px;
  }

  .cccs-calendar-day-header {
    align-items: center;
    display: flex;
    gap: 0.4rem;
    justify-content: space-between;
    margin-bottom: 0.5rem;
  }

  .cccs-calendar-day-number {
    font-size: 1.1rem;
    font-weight: 700;
  }

  .cccs-calendar-month-label {
    background: rgba(25, 135, 84, 0.12);
    border-radius: 999px;
    color: var(--bs-success-text-emphasis);
    font-size: 0.7rem;
    font-weight: 700;
    padding: 0.15rem 0.45rem;
  }

  .cccs-calendar-event-list {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
  }

  .cccs-calendar-event {
    border-radius: 0.55rem;
    box-shadow: 0 0.15rem 0.4rem rgba(25, 135, 84, 0.18);
    font-size: 0.85rem;
    line-height: 1.2;
    padding: 0.45rem 0.55rem;
    text-align: left;
    width: 100%;
  }

  .cccs-calendar-event-location {
    display: block;
    font-size: 0.75rem;
    opacity: 0.8;
  }
</style>
