<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="">
  <title>Events | Cat Colony Care Society</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <script src="js/cmsTheme.js?v=2"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/site.css?v=7" rel="stylesheet">
</head>
<body class="page-events">
  <div data-component="header"></div>

  <main>
    <section class="route-intro events-intro">
      <div class="container">
        <div class="events-title-row">
          <div class="route-intro-copy">
            <p class="section-label">Gather for good</p>
            <h1 data-cms-text="events.PageTitle"></h1>
          </div>
          <p data-cms-text="branding.Description"></p>
        </div>
        <div class="events-intro-photo" role="img" aria-label="Campus cats gathering"></div>
      </div>
    </section>

    <section class="events-list-section">
      <div class="container">
        <div class="section-rail">
          <p class="section-label">Upcoming events</p>
          <p data-cms-text="branding.Description"></p>
        </div>
        <div class="event-list" data-cms-repeat="events">
          <template>
            <article class="event-card">
              <div class="event-card-media">
                <img class="card-img-top" data-cms-src="$item.EventPhoto" data-cms-alt="$item.EventTitle" alt="Event image">
              </div>
              <div class="event-card-body">
                <p class="event-date" data-cms-text="$item.EventDate"></p>
                <h3 data-cms-text="$item.EventTitle"></h3>
                <p data-cms-text="$item.EventDescription"></p>
              </div>
            </article>
          </template>
        </div>
      </div>
    </section>

    <section class="calendar-section">
      <div data-component="calendar"></div>
    </section>
  </main>

  <div data-component="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/cmsContentLoader.js"></script>
  <script src="js/cmsCache.js"></script>
  <script src="js/componentLoader.js?v=4"></script>
  <script src="js/cmsBinder.js?v=2"></script>
  <script src="js/cmsPage.js"></script>
  <script src="js/calendarComponent.js?v=2"></script>
  <script src="js/pages/events.js"></script>
</body>
</html>
