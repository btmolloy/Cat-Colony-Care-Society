<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta name="theme-color" content="">
    <meta name="description" content="" data-cms-content="events.Description">
    <meta property="og:title" content="Events" data-cms-content="events.PageTitle">
    <meta property="og:description" content="" data-cms-content="events.Description">
    <title>Events | Cat Colony Care Society</title>
    <script src="js/cmsTheme.js?v=4"></script>
    <link rel="stylesheet" href="css/site.css?v=18">
  </head>
  <body data-page="events" data-title-path="events.PageTitle">
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div data-component="header"></div>

    <main id="main-content">
      <header
        class="page-masthead"
        style="--masthead-image: var(--brand-image-4, none)"
        data-cms-bg="branding.backgroundimage4"
        data-cms-bg-var="--masthead-image"
      >
        <div class="container masthead-inner">
          <div class="masthead-copy">
            <p class="eyebrow eyebrow-light">Meetings &amp; activity</p>
            <h1 class="page-title" data-cms-text="events.PageTitle"></h1>
            <p class="page-lede" data-cms-text="events.Description"></p>
          </div>
        </div>
      </header>

      <section class="section section-white events-announcements">
        <div class="container">
          <div class="placeholder-events" data-cms-repeat="events">
            <template>
              <article class="placeholder-event glass-card" data-reveal>
                <div
                  class="photo-surface"
                  style="--photo: var(--brand-image-4, none)"
                  data-cms-bg="$item.EventPhoto"
                ></div>
                <div class="placeholder-event-copy">
                  <time
                    class="placeholder-date"
                    data-cms-text="$item.EventDate"
                    data-cms-datetime="$item.EventDate"
                    data-calendar-date
                    data-calendar-date-style="full"
                  ></time>
                  <h3 data-cms-text="$item.EventTitle"></h3>
                  <p data-cms-text="$item.EventDescription"></p>
                </div>
              </article>
            </template>
          </div>
        </div>
      </section>

      <section
        class="section section-photo-field"
        style="--section-image: var(--brand-image-1, none)"
        data-cms-bg="branding.backgroundimage1"
        data-cms-bg-var="--section-image"
      >
        <div class="container">
          <div class="section-heading" data-reveal>
            <p class="eyebrow">Meeting calendar</p>
            <div class="section-heading-copy">
              <h2 class="section-title" data-cms-text="meetingcalendar.CalendarTitle"></h2>
              <p class="section-lede" data-cms-text="meetingcalendar.CalendarDescription"></p>
            </div>
          </div>

          <div class="events-calendar glass-card" data-events-calendar data-reveal>
            <div class="events-calendar-toolbar">
              <p class="events-calendar-range" data-events-calendar-range></p>
              <span class="events-calendar-key"><i aria-hidden="true"></i>Today</span>
            </div>
            <div class="events-calendar-viewport" tabindex="0" aria-label="Scrollable four-week calendar">
              <div class="events-calendar-grid" data-events-calendar-grid role="grid"></div>
            </div>
          </div>
        </div>
      </section>

      <section class="closing-band">
        <div class="container closing-grid" data-reveal>
          <div class="closing-copy">
            <p class="eyebrow eyebrow-light">Official club listing</p>
            <h2 class="closing-title" data-cms-text="branding.Title"></h2>
            <p data-cms-text="branding.Description"></p>
          </div>
          <a
            class="button"
            target="_blank"
            rel="noreferrer"
            data-cms-href="contact.MyEngagmentURL"
          >Open myEngagement</a>
        </div>
      </section>
    </main>

    <div data-component="footer"></div>

    <script src="js/cmsContentLoader.js"></script>
    <script src="js/cmsCache.js?v=3"></script>
    <script src="js/componentLoader.js?v=8"></script>
    <script src="js/cmsBinder.js?v=4"></script>
    <script src="js/cmsPage.js?v=4"></script>
    <script src="js/calendarComponent.js?v=5"></script>
    <script src="js/siteInteractions.js?v=3"></script>
    <script src="js/pages/events.js?v=5"></script>
  </body>
</html>
