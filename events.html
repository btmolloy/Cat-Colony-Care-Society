<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="">
  <title>Events | Cat Colony Care Society</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <script src="js/cmsTheme.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/site.css" rel="stylesheet">
</head>
<body class="page-events">
  <div data-component="header"></div>

  <main>
    <section class="page-hero">
      <div class="container">
        <div class="page-hero-shell">
          <div class="page-hero-copy">
            <p class="eyebrow">Gather for good</p>
            <h1 class="page-title mb-4" data-cms-text="events.PageTitle">Events</h1>
            <p class="page-lead mb-0">Club events, meetings, and ways to support the campus cat colony.</p>
          </div>
        </div>
      </div>
    </section>

    <section class="section-block pt-0">
      <div class="container">
        <div class="section-heading">
          <p class="eyebrow">On the calendar</p>
          <h2 class="section-title">Featured Events</h2>
          <p class="section-intro mb-0">Show up, meet fellow cat people, and help turn compassion into practical care.</p>
        </div>
        <div class="row g-4" data-cms-repeat="events">
          <template>
            <div class="col-md-6">
              <div class="card event-card h-100">
                <img class="card-img-top" data-cms-src="$item.EventPhoto" data-cms-alt="$item.EventTitle" alt="Event image">
                <div class="card-body">
                  <h3 class="h4" data-cms-text="$item.EventTitle">Event Title</h3>
                  <p class="card-kicker mb-3" data-cms-text="$item.EventDate">Event Date</p>
                  <p class="text-body-secondary" data-cms-text="$item.EventDescription">Event description from CMS.</p>
                </div>
              </div>
            </div>
          </template>
        </div>
      </div>
    </section>

    <section class="section-block calendar-section">
      <div data-component="calendar"></div>
    </section>
  </main>

  <div data-component="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/cmsContentLoader.js"></script>
  <script src="js/cmsCache.js"></script>
  <script src="js/componentLoader.js"></script>
  <script src="js/cmsBinder.js"></script>
  <script src="js/cmsPage.js"></script>
  <script src="js/calendarComponent.js"></script>
  <script src="js/pages/events.js"></script>
</body>
</html>
