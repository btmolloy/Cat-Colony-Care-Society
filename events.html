<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Events | Cat Colony Care Society</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div data-component="header"></div>

  <main>
    <section class="py-5 bg-light border-bottom">
      <div class="container">
        <h1 class="display-5 fw-bold" data-cms-text="events.PageTitle">Events</h1>
        <p class="lead">Club events, meetings, and ways to support the campus cat colony.</p>
      </div>
    </section>

    <section class="py-5">
      <div class="container">
        <h2 class="h3 mb-4">Featured Events</h2>
        <div class="row g-4" data-cms-repeat="events">
          <template>
            <div class="col-md-6">
              <div class="card h-100 shadow-sm">
                <img class="card-img-top" data-cms-src="$item.EventPhoto" data-cms-alt="$item.EventTitle" alt="Event image">
                <div class="card-body">
                  <h3 class="h4" data-cms-text="$item.EventTitle">Event Title</h3>
                  <p class="fw-semibold text-success" data-cms-text="$item.EventDate">Event Date</p>
                  <p data-cms-text="$item.EventDescription">Event description from CMS.</p>
                </div>
              </div>
            </div>
          </template>
        </div>
      </div>
    </section>

    <section class="py-5 bg-light border-top">
      <div class="container">
        <h2 class="h3 mb-4" data-cms-text="meetingcalendar.CalendarTitle">Meeting Calendar</h2>
        <div class="row g-4" data-cms-repeat="meetingcalendar">
          <template>
            <div class="col-md-6 col-lg-4">
              <div class="card h-100">
                <div class="card-body">
                  <h3 class="h5" data-cms-text="$item.EventName">Calendar Event</h3>
                  <p class="mb-1"><strong>Date:</strong> <span data-cms-text="$item.EventDate">Date</span></p>
                  <p class="mb-1"><strong>Location:</strong> <span data-cms-text="$item.EventLocation">Location</span></p>
                  <p class="mb-0" data-cms-text="$item.EventDescription">Description</p>
                </div>
              </div>
            </div>
          </template>
        </div>
      </div>
    </section>
  </main>

  <div data-component="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/cmsContentLoader.js"></script>
  <script src="js/cmsCache.js"></script>
  <script src="js/componentLoader.js"></script>
  <script src="js/cmsBinder.js"></script>
  <script src="js/cmsPage.js"></script>
  <script src="js/pages/events.js"></script>
</body>
</html>
