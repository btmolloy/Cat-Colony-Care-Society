<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta name="theme-color" content="">
    <meta name="description" content="" data-cms-content="campuscats.PageDescriptions">
    <meta property="og:title" content="" data-cms-content="campuscats.PageTitle">
    <meta property="og:description" content="" data-cms-content="campuscats.PageDescriptions">
    <meta property="og:image" content="" data-cms-content="branding.backgroundimage3">
    <meta name="twitter:card" content="summary_large_image">
    <title data-cms-text="campuscats.PageTitle"></title>
    <script src="js/cmsTheme.js?v=4"></script>
    <link href="css/site.css?v=17" rel="stylesheet">
  </head>
  <body data-page="colony" data-title-path="campuscats.PageTitle">
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div data-component="header"></div>

    <main id="main-content">
      <header
        class="page-masthead"
        style="--masthead-image: var(--brand-image-3, none)"
        data-cms-bg="branding.backgroundimage3"
        data-cms-bg-var="--masthead-image"
      >
        <div class="container masthead-inner">
          <div class="masthead-copy">
            <p class="eyebrow eyebrow-light" data-cms-text="branding.Abreviation"></p>
            <h1 class="page-title" data-cms-text="campuscats.PageTitle"></h1>
            <p class="page-lede" data-cms-text="campuscats.PageDescriptions"></p>
          </div>
        </div>
      </header>

      <section class="section section-white">
        <div class="container">
          <div class="profile-stack" data-cms-repeat="campuscats">
            <template>
              <article class="cat-profile glass-card" data-reveal>
                <div
                  class="photo-surface"
                  role="img"
                  aria-label="Campus cat portrait"
                  style="--photo: var(--brand-image-3, none)"
                  data-cms-bg="$item.CatImage"
                ></div>
                <div class="profile-copy">
                  <div>
                    <h2 data-cms-text="$item.CatName"></h2>
                    <p data-cms-text="$item.CatDescription"></p>
                  </div>
                </div>
              </article>
            </template>
          </div>
        </div>
      </section>

      <section class="closing-band">
        <div class="container closing-grid" data-reveal>
          <div class="closing-copy">
            <p class="eyebrow eyebrow-light">More from the colony</p>
            <h2 class="closing-title" data-cms-text="branding.Title"></h2>
            <p data-cms-text="branding.Description"></p>
          </div>
          <a class="button" href="gallery.html">View The Colony</a>
        </div>
      </section>
    </main>

    <div data-component="footer"></div>

    <script src="js/cmsContentLoader.js"></script>
    <script src="js/cmsCache.js?v=3"></script>
    <script src="js/componentLoader.js?v=8"></script>
    <script src="js/cmsBinder.js?v=4"></script>
    <script src="js/cmsPage.js?v=4"></script>
    <script src="js/siteInteractions.js?v=3"></script>
    <script src="js/pages/campusCats.js?v=3"></script>
  </body>
</html>
