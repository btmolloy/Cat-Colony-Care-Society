<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campus Cats | Cat Colony Care Society</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div data-component="header"></div>

  <main>
    <section class="py-5 bg-light border-bottom">
      <div class="container">
        <div id="cms-status" class="alert alert-secondary mb-4">Loading campus cats CMS content...</div>
        <h1 class="display-5 fw-bold" data-cms-text="campuscats.PageTitle">Our Colony</h1>
        <p class="lead" data-cms-text="campuscats.PageDescriptions">Take a look at our current cats.</p>
      </div>
    </section>

    <section class="py-5">
      <div class="container">
        <div class="row g-4" data-cms-repeat="campuscats">
          <template>
            <div class="col-md-6 col-lg-4">
              <div class="card h-100 shadow-sm">
                <img class="card-img-top" data-cms-src="$item.CatImage" data-cms-alt="$item.CatName" alt="Campus cat">
                <div class="card-body">
                  <p class="text-uppercase small fw-semibold text-success mb-2">Campus Cat</p>
                  <h2 class="h4" data-cms-text="$item.CatName">Cat Name</h2>
                  <p data-cms-text="$item.CatDescription">Cat description from CMS.</p>
                </div>
              </div>
            </div>
          </template>
        </div>
      </div>
    </section>
  </main>

  <div data-component="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/cmsContentLoader.js"></script>
  <script src="js/cmsCache.js"></script>
  <script src="js/componentLoader.js"></script>
  <script src="js/cmsBinder.js"></script>
  <script src="js/cmsPage.js"></script>
  <script src="js/pages/campusCats.js"></script>
</body>
</html>
