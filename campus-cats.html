<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="">
  <title>Campus Cats | Cat Colony Care Society</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <script src="js/cmsTheme.js?v=2"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/site.css?v=7" rel="stylesheet">
</head>
<body class="page-cats">
  <div data-component="header"></div>

  <main>
    <section class="route-intro cats-intro">
      <div class="container">
        <div class="cats-intro-grid">
          <div class="route-intro-copy">
            <p class="section-label">Meet our residents</p>
            <h1 data-cms-text="campuscats.PageTitle"></h1>
            <p data-cms-text="campuscats.PageDescriptions"></p>
          </div>
          <div class="route-photo cats-intro-photo" role="img" aria-label="Campus cat"></div>
        </div>
      </div>
    </section>

    <section class="collection-section cats-collection">
      <div class="container">
        <div class="section-rail">
          <p class="section-label">Resident profiles</p>
          <p data-cms-text="campuscats.PageDescriptions"></p>
        </div>
        <div class="row g-4 g-xl-5" data-cms-repeat="campuscats">
          <template>
            <div class="col-md-6 col-lg-4">
              <div class="card cat-card h-100">
                <img class="card-img-top" data-cms-src="$item.CatImage" data-cms-alt="$item.CatName" alt="Campus cat">
                <div class="card-body">
                  <h2 class="h4" data-cms-text="$item.CatName"></h2>
                  <p class="text-body-secondary" data-cms-text="$item.CatDescription"></p>
                </div>
              </div>
            </div>
          </template>
        </div>
      </div>
    </section>
  </main>

  <div data-component="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/cmsContentLoader.js"></script>
  <script src="js/cmsCache.js"></script>
  <script src="js/componentLoader.js?v=4"></script>
  <script src="js/cmsBinder.js?v=2"></script>
  <script src="js/cmsPage.js"></script>
  <script src="js/pages/campusCats.js"></script>
</body>
</html>
