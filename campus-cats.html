<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="">
  <title>Campus Cats | Cat Colony Care Society</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <script src="js/cmsTheme.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/site.css" rel="stylesheet">
</head>
<body class="page-cats">
  <div data-component="header"></div>

  <main>
    <section class="page-hero">
      <div class="container">
        <div class="page-hero-shell">
          <div class="page-hero-copy">
            <p class="eyebrow">Meet our residents</p>
            <h1 class="page-title mb-4" data-cms-text="campuscats.PageTitle">Our Colony</h1>
            <p class="page-lead mb-0" data-cms-text="campuscats.PageDescriptions">Take a look at our current cats.</p>
          </div>
        </div>
      </div>
    </section>

    <section class="section-block pt-0">
      <div class="container">
        <div class="section-heading">
          <p class="eyebrow">Whiskers, paws &amp; personalities</p>
          <h2 class="section-title">The cats of our campus.</h2>
        </div>
        <div class="row g-4" data-cms-repeat="campuscats">
          <template>
            <div class="col-md-6 col-lg-4">
              <div class="card cat-card h-100">
                <img class="card-img-top" data-cms-src="$item.CatImage" data-cms-alt="$item.CatName" alt="Campus cat">
                <div class="card-body">
                  <p class="card-kicker mb-2">Campus Cat</p>
                  <h2 class="h4" data-cms-text="$item.CatName">Cat Name</h2>
                  <p class="text-body-secondary" data-cms-text="$item.CatDescription">Cat description from CMS.</p>
                </div>
              </div>
            </div>
          </template>
        </div>
      </div>
    </section>
  </main>

  <div data-component="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/cmsContentLoader.js"></script>
  <script src="js/cmsCache.js"></script>
  <script src="js/componentLoader.js"></script>
  <script src="js/cmsBinder.js"></script>
  <script src="js/cmsPage.js"></script>
  <script src="js/pages/campusCats.js"></script>
</body>
</html>
