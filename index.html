<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="">
  <title>Cat Colony Care Society</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <script src="js/cmsTheme.js?v=2"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/site.css?v=7" rel="stylesheet">
</head>
<body class="page-home">
  <div data-component="header"></div>

  <main>
    <section class="home-hero">
      <div class="container">
        <div class="home-hero-grid">
          <div class="home-hero-copy">
            <p class="section-label" data-cms-text="branding.Abreviation"></p>
            <h1 class="home-hero-title" data-cms-text="branding.Title"></h1>
            <p class="home-hero-lead" data-cms-text="branding.Description"></p>
          </div>
          <div class="home-hero-photo">
            <aside class="home-hero-action glass-accent">
              <img class="home-hero-action-image" data-cms-src="calltoaction.Image" alt="Get involved with the Cat Colony Care Society">
              <p class="utility-label">Get involved</p>
              <h2 data-cms-text="calltoaction.Title"></h2>
              <p data-cms-text="calltoaction.Paragraph"></p>
              <a class="btn btn-success" href="#" data-cms-href="calltoaction.SignUpLink">Sign Up</a>
            </aside>
          </div>
        </div>
      </div>
    </section>

    <section class="story-section">
      <div class="container">
        <div class="section-rail">
          <p class="section-label">Inside the colony</p>
          <p data-cms-text="branding.Description"></p>
        </div>
        <div id="homepageCarousel" class="carousel slide" data-bs-ride="carousel">
          <div class="carousel-inner" data-cms-repeat="landingcarousel">
            <template>
              <div class="carousel-item" data-cms-first-class="active">
                <img class="d-block w-100" data-cms-src="$item.Image" data-cms-alt="$item.Title" alt="Campus cat carousel image">
                <div class="carousel-caption glass-accent">
                  <p class="utility-label">From our community</p>
                  <h2 data-cms-text="$item.Title"></h2>
                  <p data-cms-text="$item.Paragraph"></p>
                  <a class="text-link" href="#" data-cms-href="$item.Link">Learn More</a>
                </div>
              </div>
            </template>
          </div>
          <button class="carousel-control-prev" type="button" data-bs-target="#homepageCarousel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
          </button>
          <button class="carousel-control-next" type="button" data-bs-target="#homepageCarousel" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
          </button>
        </div>
      </div>
    </section>

    <section class="fundraising-section">
      <div class="container">
        <div class="fundraising-photo">
          <div class="fundraising-panel glass-accent">
            <p class="section-label">GoFundMe</p>
            <h2 data-cms-text="gofundme.Title"></h2>
            <p data-cms-text="gofundme.Paragraph"></p>
            <a class="btn btn-warning" href="#" data-cms-href="gofundme.Link">Donate</a>
          </div>
        </div>
      </div>
    </section>

    <section class="contact-strip">
      <div class="container">
        <div class="contact-strip-grid">
          <div>
            <p class="section-label">Stay connected</p>
            <h2 data-cms-text="branding.Title"></h2>
          </div>
          <dl class="contact-details">
            <div>
              <dt>Email</dt>
              <dd data-cms-text="contact.Email"></dd>
            </div>
            <div>
              <dt>Instagram</dt>
              <dd><a href="#" data-cms-href="contact.InstagramURL">Instagram</a></dd>
            </div>
            <div>
              <dt>MyEngagement</dt>
              <dd><a href="#" data-cms-href="contact.MyEngagmentURL">MyEngagement</a></dd>
            </div>
          </dl>
        </div>
      </div>
    </section>
  </main>

  <div data-component="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/cmsContentLoader.js"></script>
  <script src="js/cmsCache.js"></script>
  <script src="js/componentLoader.js?v=4"></script>
  <script src="js/cmsBinder.js?v=2"></script>
  <script src="js/cmsPage.js"></script>
  <script src="js/pages/index.js"></script>
</body>
</html>
