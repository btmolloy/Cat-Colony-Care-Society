<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta name="theme-color" content="">
    <meta name="description" content="" data-cms-content="branding.Description">
    <meta property="og:type" content="website">
    <meta property="og:title" content="" data-cms-content="branding.Title">
    <meta property="og:description" content="" data-cms-content="branding.Description">
    <meta property="og:image" content="" data-cms-content="branding.backgroundimage1">
    <meta name="twitter:card" content="summary_large_image">
    <title data-cms-text="branding.Title"></title>
    <script src="js/cmsTheme.js?v=4"></script>
    <link href="css/site.css?v=16" rel="stylesheet">
  </head>
  <body data-page="home" data-title-path="branding.Title">
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div data-component="header"></div>

    <main id="main-content">
      <section class="home-hero" data-carousel aria-label="Featured club information" aria-roledescription="carousel">
        <div data-cms-repeat="landingcarousel">
          <template>
            <article
              class="hero-slide"
              data-slide
              data-cms-first-class="is-active"
              data-cms-bg="$item.Image"
              data-cms-bg-var="--hero-image"
              style="--hero-image: var(--brand-image-1, none)"
              aria-hidden="true"
            >
              <div class="container hero-content">
                <div class="hero-copy">
                  <p class="eyebrow eyebrow-light" data-cms-text="branding.Abreviation"></p>
                  <h1 class="hero-title" data-cms-text="$item.Title"></h1>
                  <p class="hero-lede" data-cms-text="$item.Paragraph"></p>
                  <div class="hero-actions">
                    <a class="button" data-cms-href="$item.Link">Learn more</a>
                  </div>
                </div>

                <aside class="hero-glass glass-card glass-card-dark" aria-label="Featured action">
                  <p class="glass-label">Featured action</p>
                  <div class="glass-callout">
                    <div
                      class="glass-callout-media"
                      data-cms-bg="calltoaction.Image"
                      data-cms-bg-var="--callout-image"
                      aria-hidden="true"
                    ></div>
                    <div>
                      <h2 data-cms-text="calltoaction.Title"></h2>
                      <p data-cms-text="calltoaction.Paragraph"></p>
                    </div>
                  </div>
                  <div class="glass-rule"></div>
                  <a class="text-link glass-link" data-cms-href="calltoaction.SignUpLink">Learn more</a>
                </aside>
              </div>
            </article>
          </template>
        </div>

        <div class="carousel-controls" role="tablist" aria-label="Choose featured information"></div>
      </section>

      <section class="section section-white editorial-fundraiser">
        <div class="container editorial-grid editorial-fundraiser-grid" data-reveal>
          <aside class="editorial-aside">
            <p>
              <span class="section-index">01</span><br>
              Community support
            </p>
          </aside>
          <div class="editorial-main">
            <h2 class="editorial-fundraiser-title" data-cms-text="gofundme.Title"></h2>
            <p class="lead-copy" data-cms-text="gofundme.Paragraph"></p>
          </div>
          <div class="editorial-action">
            <a class="button" target="_blank" rel="noreferrer" data-cms-href="gofundme.Link">Support the fundraiser</a>
          </div>
        </div>
      </section>

      <section
        class="section section-photo-field"
        style="--section-image: var(--brand-image-1, none)"
        data-cms-bg="branding.backgroundimage1"
        data-cms-bg-var="--section-image"
      >
        <div class="container">
          <div class="section-heading club-rules-heading" data-reveal>
            <p class="eyebrow">Club guidance</p>
            <div class="section-heading-copy">
              <h2 class="section-title" data-cms-text="clubrules.Title"></h2>
            </div>
          </div>

          <div class="rule-list glass-card" data-club-rules data-reveal>
            <template>
              <article class="rule-row" data-club-rule>
                <span class="rule-number" data-rule-number aria-hidden="true"></span>
                <p data-rule-copy></p>
              </article>
            </template>
          </div>
        </div>
      </section>

      <section class="closing-band">
        <div class="container closing-grid" data-reveal>
          <div class="closing-copy">
            <p class="eyebrow eyebrow-light">Membership &amp; support</p>
            <h2 class="closing-title" data-cms-text="calltoaction.Title"></h2>
            <p data-cms-text="calltoaction.Paragraph"></p>
          </div>
          <a class="button" data-cms-href="calltoaction.SignUpLink">Get Involved</a>
        </div>
      </section>
    </main>

    <div data-component="footer"></div>

    <script src="js/cmsContentLoader.js"></script>
    <script src="js/cmsCache.js?v=3"></script>
    <script src="js/componentLoader.js?v=8"></script>
    <script src="js/cmsBinder.js?v=4"></script>
    <script src="js/cmsPage.js?v=4"></script>
    <script src="js/siteInteractions.js?v=3"></script>
    <script src="js/pages/index.js?v=5"></script>
  </body>
</html>
