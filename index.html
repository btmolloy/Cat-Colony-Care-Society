<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta name="theme-color" content="">
    <meta name="description" content="" data-cms-content="branding.Description">
    <meta property="og:type" content="website">
    <meta property="og:title" content="" data-cms-content="branding.Title">
    <meta property="og:description" content="" data-cms-content="branding.Description">
    <meta property="og:image" content="" data-cms-content="branding.backgroundimage1">
    <meta name="twitter:card" content="summary_large_image">
    <title data-cms-text="branding.Title"></title>
    <script src="js/cmsTheme.js?v=4"></script>
    <link href="css/site.css?v=12" rel="stylesheet">
  </head>
  <body data-page="home" data-title-path="branding.Title">
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div data-component="header"></div>

    <main id="main-content">
      <section class="home-hero" data-carousel aria-label="Featured club information" aria-roledescription="carousel">
        <div data-cms-repeat="landingcarousel">
          <template>
            <article
              class="hero-slide"
              data-slide
              data-cms-first-class="is-active"
              data-cms-bg="$item.Image"
              data-cms-bg-var="--hero-image"
              style="--hero-image: var(--brand-image-1, none)"
              aria-hidden="true"
            >
              <div class="container hero-content">
                <div class="hero-copy">
                  <p class="eyebrow eyebrow-light" data-cms-text="branding.Abreviation"></p>
                  <h1 class="hero-title" data-cms-text="$item.Title"></h1>
                  <p class="hero-lede" data-cms-text="$item.Paragraph"></p>
                  <div class="hero-actions">
                    <a class="button" data-cms-href="$item.Link">Learn more</a>
                    <a class="text-link hero-text-link" href="colony.html">Meet the colony</a>
                  </div>
                </div>

                <aside class="hero-glass glass-card glass-card-dark" aria-label="Calendar highlight">
                  <p class="glass-label">Calendar highlight</p>
                  <div class="glass-event">
                    <time
                      class="date-block"
                      data-calendar-date
                      data-calendar-date-style="block"
                      data-cms-text="meetingcalendar.event1.EventDate"
                      data-cms-datetime="meetingcalendar.event1.EventDate"
                    ></time>
                    <div>
                      <h2 data-cms-text="meetingcalendar.event1.EventName"></h2>
                      <p data-cms-text="meetingcalendar.event1.EventLocation"></p>
                    </div>
                  </div>
                  <div class="glass-rule"></div>
                  <a class="text-link glass-link" href="events.html">See the full calendar</a>
                </aside>
              </div>
            </article>
          </template>
        </div>

        <div class="carousel-controls" role="tablist" aria-label="Choose featured information"></div>
      </section>

      <section class="section section-white">
        <div class="container editorial-grid" data-reveal>
          <aside class="editorial-aside">
            <p>
              <span data-cms-text="branding.Abreviation"></span><br>
              <span data-cms-text="branding.Title"></span>
            </p>
          </aside>
          <div class="editorial-main">
            <p class="lead-copy" data-cms-text="calltoaction.Paragraph"></p>
            <p data-cms-text="branding.Description"></p>
            <a class="text-link" href="about.html">Read about the society</a>
          </div>
          <ul class="metric-rail" aria-label="CMS content overview">
            <li><span>Calendar</span><strong data-cms-count="meetingcalendar" data-cms-count-singular="entry" data-cms-count-plural="entries"></strong></li>
            <li><span>Gallery</span><strong data-cms-count="gallery" data-cms-count-singular="image" data-cms-count-plural="images"></strong></li>
            <li><span>Colony</span><strong data-cms-count="campuscats" data-cms-count-singular="profile" data-cms-count-plural="profiles"></strong></li>
          </ul>
        </div>
      </section>

      <section
        class="section section-photo-field"
        style="--section-image: var(--brand-image-1, none)"
        data-cms-bg="branding.backgroundimage1"
        data-cms-bg-var="--section-image"
      >
        <div class="container">
          <div class="section-heading" data-reveal>
            <p class="eyebrow">From the calendar</p>
            <div class="section-heading-copy">
              <h2 class="section-title" data-cms-text="meetingcalendar.CalendarTitle"></h2>
              <p class="section-lede" data-cms-text="branding.Description"></p>
            </div>
          </div>

          <div class="event-list glass-card" data-cms-repeat="meetingcalendar" data-reveal>
            <template>
              <article class="event-row">
                <time
                  class="event-date"
                  data-calendar-date
                  data-calendar-date-style="row"
                  data-cms-text="$item.EventDate"
                  data-cms-datetime="$item.EventDate"
                ></time>
                <div class="event-info">
                  <h3 data-cms-text="$item.EventName"></h3>
                  <p data-cms-text="$item.EventDescription"></p>
                </div>
                <p class="event-location" data-cms-text="$item.EventLocation"></p>
                <a class="text-link" href="events.html">Details</a>
              </article>
            </template>
          </div>
        </div>
      </section>

      <section class="closing-band">
        <div class="container closing-grid" data-reveal>
          <div class="closing-copy">
            <p class="eyebrow eyebrow-light">Membership &amp; support</p>
            <h2 class="closing-title" data-cms-text="calltoaction.Title"></h2>
            <p data-cms-text="calltoaction.Paragraph"></p>
          </div>
          <a class="button" data-cms-href="calltoaction.SignUpLink">Get involved</a>
        </div>
      </section>
    </main>

    <div data-component="footer"></div>

    <script src="js/cmsContentLoader.js"></script>
    <script src="js/cmsCache.js?v=3"></script>
    <script src="js/componentLoader.js?v=6"></script>
    <script src="js/cmsBinder.js?v=4"></script>
    <script src="js/cmsPage.js?v=4"></script>
    <script src="js/calendarComponent.js?v=5"></script>
    <script src="js/siteInteractions.js?v=2"></script>
    <script src="js/pages/index.js?v=3"></script>
  </body>
</html>
