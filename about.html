<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>About | Cat Colony Care Society</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div data-component="header"></div>

  <main>
    <section class="py-5 bg-light border-bottom">
      <div class="container">
        <div class="row align-items-center g-4">
          <div class="col-lg-8">
            <p class="text-uppercase fw-semibold text-success mb-2" data-cms-text="branding.Abreviation">CCCS</p>
            <h1 class="display-5 fw-bold" data-cms-text="aboutmission.Title">About the Club</h1>
            <p class="lead" data-cms-text="aboutmission.Paragraph1">Learn more about the students caring for campus cats.</p>
          </div>
          <div class="col-lg-4">
            <img class="img-fluid rounded shadow-sm" data-cms-src="aboutmission.Image1" alt="About Cat Colony Care Society">
          </div>
        </div>
      </div>
    </section>

    <section class="py-5">
      <div class="container">
        <div class="row g-4">
          <div class="col-lg-6">
            <h2 class="h3">Our Mission</h2>
            <p data-cms-text="aboutmission.Paragraph1">Mission content from the CMS appears here.</p>
            <p data-cms-text="aboutmission.Paragraph2">Additional mission content from the CMS appears here.</p>
          </div>
          <div class="col-lg-6">
            <img class="img-fluid rounded shadow-sm" data-cms-src="aboutmission.Image2" alt="Campus cat care mission">
          </div>
        </div>
      </div>
    </section>

    <section class="py-5 bg-light border-top">
      <div class="container">
        <h2 class="h3 mb-4">E-Board</h2>
        <div class="row g-4" data-cms-repeat="abouteboard">
          <template>
            <div class="col-md-6 col-lg-4">
              <div class="card h-100 shadow-sm">
                <img class="card-img-top" data-cms-src="$item.Image" data-cms-alt="$item.Name" alt="E-board member">
                <div class="card-body">
                  <h3 class="h5" data-cms-text="$item.Name">Member Name</h3>
                  <p class="fw-semibold text-success mb-2" data-cms-text="$item.Position">Position</p>
                  <p data-cms-text="$item.AboutParagraph">Member bio from CMS.</p>
                </div>
              </div>
            </div>
          </template>
        </div>
      </div>
    </section>
  </main>

  <div data-component="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/cmsContentLoader.js"></script>
  <script src="js/cmsCache.js"></script>
  <script src="js/componentLoader.js"></script>
  <script src="js/cmsBinder.js"></script>
  <script src="js/cmsPage.js"></script>
  <script src="js/pages/about.js"></script>
</body>
</html>
