<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta name="theme-color" content="">
    <meta name="description" content="" data-cms-content="branding.Description">
    <meta property="og:title" content="" data-cms-content="aboutmission.Title">
    <meta property="og:description" content="" data-cms-content="branding.Description">
    <meta property="og:image" content="" data-cms-content="branding.backgroundimage2">
    <meta name="twitter:card" content="summary_large_image">
    <title data-cms-text="aboutmission.Title"></title>
    <script src="js/cmsTheme.js?v=4"></script>
    <link href="css/site.css?v=14" rel="stylesheet">
  </head>
  <body data-page="about" data-title-path="aboutmission.Title">
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div data-component="header"></div>

    <main id="main-content">
      <header
        class="page-masthead"
        style="--masthead-image: var(--brand-image-2, none)"
        data-cms-bg="branding.backgroundimage2"
        data-cms-bg-var="--masthead-image"
      >
        <div class="container masthead-inner">
          <div class="masthead-copy">
            <p class="eyebrow eyebrow-light" data-cms-text="branding.Abreviation"></p>
            <h1 class="page-title" data-cms-text="aboutmission.Title"></h1>
            <p class="page-lede" data-cms-text="branding.Description"></p>
          </div>
          <p class="masthead-index">Page 02<strong data-cms-text="aboutmission.Title"></strong></p>
        </div>
      </header>

      <section class="section section-white">
        <div class="container">
          <div class="section-heading" data-reveal>
            <p class="eyebrow">01 · Mission</p>
            <div class="section-heading-copy">
              <h2 class="section-title" data-cms-text="aboutmission.Title"></h2>
              <p class="section-lede" data-cms-text="branding.Description"></p>
            </div>
          </div>

          <div class="editorial-grid" data-reveal>
            <aside class="editorial-aside">
              <p>
                <span data-cms-text="branding.Abreviation"></span><br>
                <span data-cms-text="aboutmission.Title"></span>
              </p>
            </aside>
            <div class="editorial-main">
              <p class="lead-copy" data-cms-text="aboutmission.Paragraph1"></p>
              <p data-cms-text="aboutmission.Paragraph2"></p>
            </div>
          </div>

          <div class="image-pair" data-reveal>
            <div
              class="photo-surface"
              role="img"
              aria-label="Mission photograph"
              style="--photo: var(--brand-image-1, none)"
              data-cms-bg="aboutmission.Image1"
            ></div>
            <div
              class="photo-surface"
              role="img"
              aria-label="Mission photograph"
              style="--photo: var(--brand-image-2, none)"
              data-cms-bg="aboutmission.Image2"
            ></div>
          </div>
        </div>
      </section>

      <section
        class="section section-photo-field"
        style="--section-image: var(--brand-image-1, none)"
        data-cms-bg="branding.backgroundimage1"
        data-cms-bg-var="--section-image"
      >
        <div class="container">
          <div class="section-heading" data-reveal>
            <p class="eyebrow">02 · Executive board</p>
            <div class="section-heading-copy">
              <h2 class="section-title" data-cms-text="branding.Title"></h2>
              <p class="section-lede" data-cms-text="branding.Description"></p>
            </div>
          </div>

          <div class="board-grid" data-cms-repeat="abouteboard" data-reveal>
            <template>
              <article class="person-card glass-card">
                <div
                  class="photo-surface"
                  role="img"
                  aria-label="Executive board member portrait"
                  style="--photo: var(--brand-image-1, none)"
                  data-cms-bg="$item.Image"
                ></div>
                <div class="person-copy">
                  <p class="person-role" data-cms-text="$item.Position"></p>
                  <h3 data-cms-text="$item.Name"></h3>
                  <p data-cms-text="$item.AboutParagraph"></p>
                </div>
              </article>
            </template>
          </div>
        </div>
      </section>

      <section class="closing-band">
        <div class="container closing-grid" data-reveal>
          <div class="closing-copy">
            <p class="eyebrow eyebrow-light">Start a conversation</p>
            <h2 class="closing-title" data-cms-text="calltoaction.Title"></h2>
            <p data-cms-text="calltoaction.Paragraph"></p>
          </div>
          <a class="button" data-cms-href="calltoaction.SignUpLink">Get involved</a>
        </div>
      </section>
    </main>

    <div data-component="footer"></div>

    <script src="js/cmsContentLoader.js"></script>
    <script src="js/cmsCache.js?v=3"></script>
    <script src="js/componentLoader.js?v=8"></script>
    <script src="js/cmsBinder.js?v=4"></script>
    <script src="js/cmsPage.js?v=4"></script>
    <script src="js/siteInteractions.js?v=3"></script>
    <script src="js/pages/about.js?v=3"></script>
  </body>
</html>
