<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="">
  <title>About | Cat Colony Care Society</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <script src="js/cmsTheme.js?v=2"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/site.css?v=7" rel="stylesheet">
</head>
<body class="page-about">
  <div data-component="header"></div>

  <main>
    <section class="route-intro about-intro">
      <div class="container">
        <div class="about-intro-grid">
          <div class="route-intro-copy">
            <p class="section-label" data-cms-text="branding.Abreviation"></p>
            <h1 data-cms-text="aboutmission.Title"></h1>
            <p data-cms-text="branding.Description"></p>
          </div>
          <figure class="about-intro-figure">
            <img data-cms-src="aboutmission.Image1" alt="About Cat Colony Care Society">
          </figure>
        </div>
      </div>
    </section>

    <section class="mission-section">
      <div class="container">
        <div class="mission-layout">
          <div class="mission-photo-wrap">
            <img class="mission-image" data-cms-src="aboutmission.Image2" alt="Campus cat care mission">
          </div>
          <div class="mission-copy glass-accent">
            <p class="section-label">Why we’re here</p>
            <h2 data-cms-text="aboutmission.Title"></h2>
            <p data-cms-text="aboutmission.Paragraph1"></p>
            <p data-cms-text="aboutmission.Paragraph2"></p>
          </div>
        </div>
      </div>
    </section>

    <section class="people-section">
      <div class="container">
        <div class="section-rail">
          <p class="section-label">The E-Board</p>
          <p data-cms-text="branding.Description"></p>
        </div>
        <div class="row g-4 g-xl-5" data-cms-repeat="abouteboard">
          <template>
            <div class="col-md-6 col-lg-4">
              <div class="card profile-card h-100">
                <img class="card-img-top" data-cms-src="$item.Image" data-cms-alt="$item.Name" alt="E-board member">
                <div class="card-body">
                  <h3 class="h5" data-cms-text="$item.Name"></h3>
                  <p class="role-label" data-cms-text="$item.Position"></p>
                  <p class="text-body-secondary" data-cms-text="$item.AboutParagraph"></p>
                </div>
              </div>
            </div>
          </template>
        </div>
      </div>
    </section>
  </main>

  <div data-component="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/cmsContentLoader.js"></script>
  <script src="js/cmsCache.js"></script>
  <script src="js/componentLoader.js?v=4"></script>
  <script src="js/cmsBinder.js?v=2"></script>
  <script src="js/cmsPage.js"></script>
  <script src="js/pages/about.js"></script>
</body>
</html>
