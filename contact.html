<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="">
  <title>Contact | Cat Colony Care Society</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <script src="js/cmsTheme.js?v=2"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/site.css?v=7" rel="stylesheet">
</head>
<body class="page-contact">
  <div data-component="header"></div>

  <main>
    <section class="route-intro contact-intro">
      <div class="container">
        <div class="contact-intro-grid">
          <div class="route-intro-copy">
            <p class="section-label">Contact</p>
            <h1 data-cms-text="branding.Title"></h1>
            <p data-cms-text="branding.Description"></p>
          </div>
          <div class="route-photo contact-intro-photo" role="img" aria-label="Campus cat"></div>
        </div>
      </div>
    </section>

    <section class="contact-section">
      <div class="container">
        <div class="contact-layout">
          <div class="contact-information">
            <p class="section-label">Find us online</p>
            <h2 data-cms-text="branding.Title"></h2>
            <p data-cms-text="branding.Description"></p>
            <dl class="contact-details contact-details-large">
              <div>
                <dt>Email</dt>
                <dd data-cms-text="contact.Email"></dd>
              </div>
              <div>
                <dt>Instagram</dt>
                <dd><a href="#" data-cms-href="contact.InstagramURL">Follow our updates</a></dd>
              </div>
              <div>
                <dt>MyEngagement</dt>
                <dd><a href="#" data-cms-href="contact.MyEngagmentURL">View our organization</a></dd>
              </div>
            </dl>
          </div>
          <div class="contact-note-photo">
            <div class="contact-note glass-accent">
              <p class="utility-label">Care starts with community</p>
              <h2 data-cms-text="branding.Title"></h2>
              <p data-cms-text="branding.Description"></p>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div data-component="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/cmsContentLoader.js"></script>
  <script src="js/cmsCache.js"></script>
  <script src="js/componentLoader.js?v=4"></script>
  <script src="js/cmsBinder.js?v=2"></script>
  <script src="js/cmsPage.js"></script>
  <script src="js/pages/contact.js"></script>
</body>
</html>
