<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Cat Colony Care Society</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div data-component="header"></div>

  <main>
    <section class="py-5 bg-light border-bottom">
      <div class="container">
        <div id="cms-status" class="alert alert-secondary mb-4">Loading contact CMS content...</div>
        <h1 class="display-5 fw-bold">Contact</h1>
        <p class="lead">Reach out to the club or follow along online.</p>
      </div>
    </section>

    <section class="py-5">
      <div class="container">
        <div class="row g-4">
          <div class="col-lg-7">
            <div class="card shadow-sm">
              <div class="card-body">
                <h2 class="h3">Club Contact Information</h2>
                <p>Email: <span data-cms-text="contact.Email">example@email.com</span></p>
                <p>Instagram: <a href="#" data-cms-href="contact.InstagramURL" data-cms-text="contact.InstagramURL">Instagram</a></p>
                <p>MyEngagement: <a href="#" data-cms-href="contact.MyEngagmentURL" data-cms-text="contact.MyEngagmentURL">MyEngagement</a></p>
              </div>
            </div>
          </div>
          <div class="col-lg-5">
            <div class="card h-100 bg-light border-0">
              <div class="card-body">
                <h2 class="h4" data-cms-text="branding.Title">Cat Colony Care Society</h2>
                <p data-cms-text="branding.Description">Protecting and caring for the campus cat colony.</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div data-component="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/cmsContentLoader.js"></script>
  <script src="js/cmsCache.js"></script>
  <script src="js/componentLoader.js"></script>
  <script src="js/cmsBinder.js"></script>
  <script src="js/cmsPage.js"></script>
  <script src="js/pages/contact.js"></script>
</body>
</html>
